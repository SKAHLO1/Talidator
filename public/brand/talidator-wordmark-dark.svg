<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 40" fill="none">
  <title>Talidator</title>
  <defs>
    <linearGradient id="t-ring" x1="16" y1="2" x2="16" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fe0d0"/>
      <stop offset="1" stop-color="#1f8f82"/>
    </linearGradient>
    <linearGradient id="t-core" x1="12.5" y1="12.5" x2="19.5" y2="19.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8af0e2"/>
      <stop offset="1" stop-color="#2a9d8f"/>
    </linearGradient>
  </defs>
  <g transform="translate(2 4)">
  <!-- outer bond -->
  <path d="M16 2.6 29.4 16 16 29.4 2.6 16Z" stroke="url(#t-ring)" stroke-width="1.9" stroke-linejoin="round"/>
  <!-- quorum: four validators -->
  <g stroke="#3fbfae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <path d="M12.64 11.36 16 8l3.36 3.36"/>
    <path d="M20.64 12.64 24 16l-3.36 3.36"/>
    <path d="M19.36 20.64 16 24l-3.36-3.36"/>
    <path d="M11.36 19.36 8 16l3.36-3.36"/>
  </g>
  <!-- verified core -->
  <path d="M16 12.4 19.6 16 16 19.6 12.4 16Z" fill="url(#t-core)"/>
  <path d="M16 12.4 12.4 16H16Z" fill="#fff" fill-opacity=".38"/>
  <path d="M19.6 16 16 19.6V16Z" fill="#0c1a21" fill-opacity=".18"/>
  </g>
  <text x="44" y="28.5" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="25" font-weight="600" letter-spacing="-0.6">Talidator</text>
</svg>
